spring.application.name=trip-planner-api

server.port=5000

# PostgreSQL Database (for production)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tripplanner}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.root=WARN
logging.level.com.tripplanner=INFO

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-environment}
jwt.expiration=${JWT_EXPIRATION:86400000}
