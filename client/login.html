<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TripPlanner AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">✈️</span>
                TripPlanner AI
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="signup.html" class="btn">Sign Up</a>
            </nav>
        </div>
    </header>

    <div class="form-container fade-in">
        <h2 class="section-title" style="font-size: 1.75rem;">Welcome Back</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">Login to plan your next adventure</p>
        
        <div id="alert" class="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-large btn-accent" style="width: 100%">Login</button>
        </form>
        
        <p style="margin-top: 1.5rem; text-align: center; color: var(--text-secondary);">
            Don't have an account? <a href="signup.html" style="color: var(--primary-blue); font-weight: 500;">Sign Up Free</a>
        </p>

        <div style="margin-top: 2rem; padding: 1rem; background: var(--sky-blue); border-radius: 10px; border-left: 4px solid var(--golden-yellow);">
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;"><strong>Admin Demo Access:</strong></p>
            <p style="font-size: 0.8rem; color: var(--text-light);">Email: admin@travel.com<br>Password: admin123</p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
