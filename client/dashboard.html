<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Itinerary Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header>
        <a href="dashboard.html" class="logo">TripPlanner AI</a>
        <nav id="navLinks">
            <span style="margin-right: 1rem">Welcome, <span id="userName">User</span></span>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </header>

    <div class="container">
        <div class="trip-form">
            <h2 class="section-title" style="text-align: left; font-size: 1.5rem">Create New Trip</h2>
            <form id="tripForm">
                <div class="grid" style="grid-template-columns: 1fr 1fr;">
                    <div class="form-group">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" class="form-control" placeholder="e.g. Paris" required>
                    </div>
                    <div class="form-group">
                        <label for="budget">Budget</label>
                        <select id="budget" class="form-control">
                            <option value="cheap">Budget ($)</option>
                            <option value="moderate" selected>Moderate ($$)</option>
                            <option value="luxury">Luxury ($$$)</option>
                        </select>
                    </div>
                </div>
                <div class="grid" style="grid-template-columns: 1fr 1fr 1fr;">
                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="travellers">Travellers</label>
                        <input type="number" id="travellers" class="form-control" min="1" value="1" required>
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem">Generate AI Itinerary</button>
            </form>
        </div>

        <div id="itineraryResult" class="itinerary-result">
            <h2 class="section-title">Your Itinerary</h2>
            <div id="itineraryContent"></div>
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
